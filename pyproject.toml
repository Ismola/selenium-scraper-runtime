[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selenium-scraper-runtime"
version = "0.2.0"
description = "Shared logging, metrics, and browser helpers for Selenium scraper services"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ismola"}]
dependencies = ["flask>=3,<4", "prometheus-client>=0.20,<1"]

[project.optional-dependencies]
browser = ["selenium>=4.33,<5", "psutil>=5.9,<8", "selenium-stealth>=1,<2"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
